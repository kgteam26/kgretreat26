  :root {

    --card: #FBF7EC;
    --ink: #24303B;
    --muted: #6E7A72;
    --line: #DED2B4;
    --accent: #1E7A8C;
    --accent-warm: #D97D3D;
    --sky-top: #DCEBEC;
    --hill-1: #B9C9CE;
    --hill-2: #7FA3AC;
    --hill-3: #2F5C66;
    --sun: #D97D3D;
    --snow: #FBFBF6;
    --shadow: rgba(36, 48, 59, 0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    max-width: 560px;
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .hero {
    position: relative;
    height: 148px;
    flex-shrink: 0;
    overflow: hidden;
    background: var(--sky-top);
  }

  .hero svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hill-1 { fill: var(--hill-1); }
  .hill-2 { fill: var(--hill-2); }
  .hill-3 { fill: var(--hill-3); }
  .snow { fill: var(--snow); opacity: 0.85; }
  .sun { fill: var(--sun); opacity: 0.9; }

  header.masthead {
    flex-shrink: 0;
    padding: 18px 20px 22px;
  }

  .masthead-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .eyebrow {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .lang-toggle {
    flex: 0 0 auto;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font-family: inherit;
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  .lang-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  h1 {
    margin: 0.2rem 0 0.15rem;
    font-size: clamp(1.7rem, 6vw, 2.1rem);
    font-weight: 800;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .date-range {
    margin: 0;
    color: var(--muted);
    font-size: 0.95rem;
    font-variant-numeric: tabular-nums;
  }

  nav.day-tabs {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    gap: 8px;
    padding: 10px 20px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav.day-tabs::-webkit-scrollbar { display: none; }

  .day-tab {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 8px 16px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .day-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .day-tab .wd {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.7;
  }
  .day-tab .num {
    font-size: 1.05rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .day-tab[aria-selected="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--paper);
  }
  .day-tab[aria-selected="true"] .wd { opacity: 0.85; }

  main {
    padding: 22px 20px 48px;
  }

  .day-label {
    margin: 0 0 18px;
    font-size: 1.05rem;
    font-weight: 700;
  }

  .timeline {
    position: relative;
    list-style: none;
    margin: 0;
    padding: 0 0 0 22px;
  }
  .timeline::before {
    content: "";
    position: absolute;
    left: 5px;
    top: 6px;
    bottom: 6px;
    width: 2px;
    background: var(--line);
  }

  .event {
    position: relative;
    padding-bottom: 20px;
  }
  .event:last-child { padding-bottom: 0; }

  .event::before {
    content: "";
    position: absolute;
    left: -22px;
    top: 5px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--dot, var(--muted));
    border: 2px solid var(--paper);
  }

  .event .time {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
  }

  .event .title {
    margin-top: 2px;
    font-size: 1.02rem;
    font-weight: 600;
    line-height: 1.35;
    text-wrap: balance;
  }

  .legend {
    display: flex;
    gap: 16px;
    margin: 18px 0 0;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 0.78rem;
    color: var(--muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  .view { animation: fade-in 0.2s ease; }
  .view[hidden] { display: none; }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Devotionals */
  .type-toggle {
    display: flex;
    gap: 8px;
    padding: 4px 20px 16px;
  }
  .type-btn {
    flex: 1;
    padding: 9px 8px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font-family: inherit;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .type-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .type-btn[aria-selected="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--paper);
  }
  .type-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .devo-card { padding: 4px 20px 0; }

  .devo-title {
    font-size: 1.2rem;
    font-weight: 800;
    margin: 0 0 6px;
    text-wrap: balance;
  }

  .devo-scripture {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin: 0 0 20px;
  }

  .devo-verses {
    font-size: 1.02rem;
    line-height: 1.85;
    margin: 0 0 26px;
    padding-left: 16px;
    border-left: 3px solid var(--accent);
  }

  .song-toggle {
    display: flex;
    gap: 8px;
    margin: 0 0 16px;
    flex-wrap: wrap;
  }

  .praise-section {
    margin: 0;
    padding: 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .praise-song { margin: 0 0 18px; }
  .praise-song:last-child { margin-bottom: 0; }
  .praise-title {
    font-size: 0.98rem;
    font-weight: 700;
    margin: 0 0 8px;
  }
  .praise-lyrics {
    font-size: 0.92rem;
    line-height: 1.7;
    color: var(--ink);
    white-space: pre-line;
    margin: 0;
  }
  .vnum {
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--accent);
    margin-right: 2px;
  }

  .devo-blanks {
    list-style: none;
    margin: 0 0 26px;
    padding: 16px 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .devo-blanks li {
    font-size: 0.95rem;
    line-height: 1.6;
  }
  .blank {
    display: inline-block;
    min-width: 70px;
    border-bottom: 1.5px dotted var(--muted);
  }

  .devo-questions {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .devo-questions li {
    display: flex;
    gap: 12px;
    font-size: 0.96rem;
    line-height: 1.6;
  }
  .qnum {
    flex: 0 0 auto;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--line);
    color: var(--ink);
    font-weight: 700;
    font-size: 0.78rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-variant-numeric: tabular-nums;
  }

  footer {
    padding: 0 20px 28px;
    color: var(--muted);
    font-size: 0.78rem;
    text-align: center;
  }

  /* Bottom tab bar */
  .bottom-tabs {
    flex-shrink: 0;
    margin-top: auto;
    position: sticky;
    bottom: 0;
    z-index: 20;
    display: flex;
    background: var(--card);
    border-top: 1px solid var(--line);
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  }
  .bottom-tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px 0;
    background: none;
    border: none;
    border-radius: 10px;
    color: var(--muted);
    font-family: inherit;
    font-weight: 700;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .bottom-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bottom-tab[aria-selected="true"] { color: var(--accent); }
  .bottom-tab .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0;
  }
  .bottom-tab[aria-selected="true"] .dot { opacity: 1; }
</style>
</head>

  function pad(n) { return String(n).padStart(2, "0"); }

  function fmt(t) {
    const [h, m] = t.split(":").map(Number);
    const ampm = h >= 12 ? "PM" : "AM";
    let h12 = h % 12;
    if (h12 === 0) h12 = 12;
    return { h12, m, ampm };
  }

  function fmtRange(start, end) {
    const s = fmt(start);
    if (!end) return `${s.h12}:${pad(s.m)} ${s.ampm}`;
    const e = fmt(end);
    if (s.ampm === e.ampm) return `${s.h12}:${pad(s.m)}–${e.h12}:${pad(e.m)} ${e.ampm}`;
    return `${s.h12}:${pad(s.m)} ${s.ampm} – ${e.h12}:${pad(e.m)} ${e.ampm}`;
  }

  function dayNum(iso) { return Number(iso.split("-")[2]); }

  function buildDayTabs(container, onSelect) {
    container.innerHTML = "";
    DAYS.forEach((day, i) => {
      const btn = document.createElement("button");
      btn.className = "day-tab";
      btn.setAttribute("role", "tab");
      btn.setAttribute("aria-selected", "false");
      btn.innerHTML = `<span class="wd">${day[LANG].abbr}</span><span class="num">${dayNum(day.date)}</span>`;
      btn.addEventListener("click", () => onSelect(i));
      container.appendChild(btn);
    });
  }

  function selectDayTab(container, index) {
    container.querySelectorAll(".day-tab").forEach((btn, i) => {
      btn.setAttribute("aria-selected", i === index ? "true" : "false");
    });
  }

  /* ---- Schedule view ---- */
  const scheduleTabs = document.getElementById("scheduleTabs");
  const scheduleMain = document.getElementById("scheduleMain");
  let scheduleIndex = 0;

  function renderSchedule(index) {
    scheduleIndex = index;
    selectDayTab(scheduleTabs, index);
    const day = DAYS[index];
    const events = SCHEDULE[day.date] || [];
    const t = UI[LANG];
    const items = events.map(ev => {
      const dotVar = ev.cat === "meal" ? "--accent-warm" : ev.cat === "worship" ? "--accent" : "--muted";
      return `<li class="event" style="--dot: var(${dotVar})">
        <div class="time">${fmtRange(ev.time, ev.endTime)}</div>
        <div class="title">${ev[LANG]}</div>
      </li>`;
    }).join("");

    scheduleMain.innerHTML = `
      <div class="view">
        <p class="day-label">${day[LANG].label}</p>
        <ul class="timeline">${items}</ul>
        <div class="legend">
          <span><i style="background:var(--accent)"></i>${t.legendWorship}</span>
          <span><i style="background:var(--accent-warm)"></i>${t.legendMeals}</span>
          <span><i style="background:var(--muted)"></i>${t.legendOther}</span>
        </div>
      </div>`;
  }

  /* ---- Devotionals view ---- */
  const devoTabs = document.getElementById("devoTabs");
  const devoMain = document.getElementById("devoMain");
  const typeToggle = document.getElementById("typeToggle");
  let devoIndex = 0;
  let devoType = "sermon";
  let praiseIndex = 0;

  function renderBlank(text) {
    return text.replace(/_{3,}/g, '<span class="blank"></span>');
  }

  function getAvailable(day) {
    const entry = DEVOTIONALS[day.date] || {};
    return { praise: !!entry.morning, morning: !!entry.morning, sermon: !!entry.sermon };
  }

  function renderDevotionals() {
    selectDayTab(devoTabs, devoIndex);

    const day = DAYS[devoIndex];
    const avail = getAvailable(day);
    if (!avail[devoType]) {
      if (avail.morning) devoType = "morning";
      else if (avail.sermon) devoType = "sermon";
    }

    typeToggle.querySelectorAll(".type-btn").forEach(btn => {
      const type = btn.dataset.type;
      btn.disabled = !avail[type];
      btn.setAttribute("aria-selected", type === devoType && avail[type] ? "true" : "false");
    });

    if (devoType === "praise") {
      if (!avail.praise) {
        devoMain.innerHTML = `
          <div class="view">
            <p class="day-label">${day[LANG].label}</p>
          </div>`;
        return;
      }

      if (praiseIndex < 0 || praiseIndex >= PRAISE_SONGS.length) praiseIndex = 0;
      const song = PRAISE_SONGS[praiseIndex];
      const songTabs = PRAISE_SONGS.map((s, i) => `<button class="type-btn song-tab" data-index="${i}" aria-selected="${i === praiseIndex ? "true" : "false"}"><span>${s.title}</span></button>`).join("");

      devoMain.innerHTML = `
        <div class="view">
          <p class="day-label">${day[LANG].label}</p>
          <div class="song-toggle">${songTabs}</div>
          <div class="devo-card">
            <div class="praise-section">
              <p class="praise-title">${song.title}</p>
              <p class="praise-lyrics">${song.lyrics}</p>
            </div>
          </div>
        </div>`;

      devoMain.querySelectorAll(".song-tab").forEach(btn => {
        btn.addEventListener("click", () => {
          praiseIndex = Number(btn.dataset.index);
          renderDevotionals();
        });
      });
      return;
    }

    const entry = DEVOTIONALS[day.date] || {};
    const contentSet = devoType === "morning" ? entry.morning : entry.sermon;
    const content = contentSet ? contentSet[LANG] : null;

    if (!content) {
      devoMain.innerHTML = `
        <div class="view">
          <p class="day-label">${day[LANG].label}</p>
        </div>`;
      return;
    }

    const title = content.title ? `<h2 class="devo-title">${content.title}</h2>` : "";
    const scripture = content.scripture ? `<p class="devo-scripture">${content.scripture}</p>` : "";
    const verses = content.verses
      ? `<p class="devo-verses">${content.verses.map(v => `<sup class="vnum">${v.num}</sup>${v.text} `).join("")}</p>`
      : "";
    const blanks = content.blanks
      ? `<ul class="devo-blanks">${content.blanks.map(b => `<li>${renderBlank(b)}</li>`).join("")}</ul>`
      : "";
    const questions = content.questions && content.questions.length
      ? `<ol class="devo-questions">${content.questions.map((q, i) => `<li><span class="qnum">${i + 1}</span><span>${q}</span></li>`).join("")}</ol>`
      : "";

    devoMain.innerHTML = `
      <div class="view">
        <p class="day-label">${day[LANG].label}</p>
        <div class="devo-card">
          ${title}
          ${scripture}
          ${verses}
          ${blanks}
          ${questions}
        </div>
      </div>`;
  }

  typeToggle.querySelectorAll(".type-btn").forEach(btn => {
    btn.addEventListener("click", () => { devoType = btn.dataset.type; renderDevotionals(); });
  });

  /* ---- Bottom tab bar ---- */
  const bottomTabs = document.getElementById("bottomTabs");
  const viewSchedule = document.getElementById("view-schedule");
  const viewDevotionals = document.getElementById("view-devotionals");
  const eyebrow = document.getElementById("eyebrow");
  let currentView = "schedule";

  function setView(view) {
    currentView = view;
    bottomTabs.querySelectorAll(".bottom-tab").forEach(btn => {
      btn.setAttribute("aria-selected", btn.dataset.view === view ? "true" : "false");
    });
    if (view === "schedule") {
      viewSchedule.hidden = false;
      viewDevotionals.hidden = true;
      eyebrow.textContent = UI[LANG].eyebrowSchedule;
    } else {
      viewSchedule.hidden = true;
      viewDevotionals.hidden = false;
      eyebrow.textContent = UI[LANG].eyebrowDevotionals;
    }
    location.hash = `/${view}`;
  }

  bottomTabs.querySelectorAll(".bottom-tab").forEach(btn => {
    btn.addEventListener("click", () => setView(btn.dataset.view));
  });

  /* ---- Language toggle ---- */
  const langToggle = document.getElementById("langToggle");
  const retreatNameEl = document.getElementById("retreatName");
  const dateRangeEl = document.getElementById("dateRange");
  const footerEl = document.getElementById("footerText");

  function applyStaticText() {
    const t = UI[LANG];
    retreatNameEl.textContent = t.retreatName;
    dateRangeEl.textContent = t.dateRange;
    footerEl.textContent = t.footer;
    document.querySelector('[data-view="schedule"] .label').textContent = t.tabSchedule;
    document.querySelector('[data-view="devotionals"] .label').textContent = t.tabDevotionals;
    document.querySelector('[data-type="praise"] span').textContent = t.typePraise;
    document.querySelector('[data-type="morning"] span').textContent = t.typeMorning;
    document.querySelector('[data-type="sermon"] span').textContent = t.typeSermon;
    langToggle.textContent = LANG === "en" ? "RU" : "EN";
    document.documentElement.lang = LANG;
  }

  function setLang(lang) {
    LANG = lang;
    applyStaticText();
    buildDayTabs(scheduleTabs, renderSchedule);
    buildDayTabs(devoTabs, i => { devoIndex = i; renderDevotionals(); });
    renderSchedule(scheduleIndex);
    renderDevotionals();
    setView(currentView);
  }

  langToggle.addEventListener("click", () => setLang(LANG === "en" ? "ru" : "en"));

  /* ---- Init ---- */
  const today = "2026-08-21";
  const startIndex = DAYS.findIndex(d => d.date === today);
  devoIndex = startIndex === -1 ? 0 : startIndex;

  applyStaticText();
  buildDayTabs(scheduleTabs, renderSchedule);
  buildDayTabs(devoTabs, i => { devoIndex = i; renderDevotionals(); });
  renderSchedule(startIndex === -1 ? 0 : startIndex);
  renderDevotionals();

  const initialView = location.hash === "#/devotionals" ? "devotionals" : "schedule";
  setView(initialView);
</script>
